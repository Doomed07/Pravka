name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  gotest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pravki
          POSTGRES_PASSWORD: pravki
          POSTGRES_DB: pravki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pravki" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Миграции
        run: |
          for f in migrations/*.up.sql; do
            PGPASSWORD=pravki psql -h localhost -U pravki -d pravki -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: go vet ./...
      - run: go test ./...
        env:
          PRAVKI_TEST_DB: "1"
          POSTGRES_HOST: localhost
          POSTGRES_USER: pravki
          POSTGRES_PASSWORD: pravki
          POSTGRES_DB: pravki
          POSTGRES_TIMEOUT: 5s
