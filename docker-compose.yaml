# Запуск: make up (всё сразу) — см. README, раздел «Веб-сервис в Docker».
services:
  pravkiapp:
    build:
      context: .
      dockerfile: cmd/pravkiapp/dockerfile
    container_name: pravki-app
    environment:
      - HTTP_ADDR=${HTTP_ADDR}
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=pravki-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LVL=${LOGGER_LVL}
      - LOGGER_FOLDER=/app/out/logs
      - TIME_ZONE=${TIME_ZONE}
      - AUTH_SESSION_TTL=${AUTH_SESSION_TTL}
      - AUTH_BCRYPT_COST=${AUTH_BCRYPT_COST}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE}
      - AUTH_SIGNUP_CODE=${AUTH_SIGNUP_CODE}
      - METRICS_ADDR=${METRICS_ADDR}
      - ENGINE_URL=http://engine:8000
      - ENGINE_TOKEN=${ENGINE_TOKEN}
      - ENGINE_TIMEOUT=${ENGINE_TIMEOUT}
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:8080"
    restart: unless-stopped
    depends_on:
      - pravki-postgres
      - engine

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    container_name: pravki-engine
    environment:
      - ENGINE_TOKEN=${ENGINE_TOKEN}
      - PRAVKI_LLM_URL=${PRAVKI_LLM_URL}
      - PRAVKI_LLM_MODEL=${PRAVKI_LLM_MODEL}
      - PRAVKI_EMBED_MODEL=${PRAVKI_EMBED_MODEL:-bge-m3}  # модель для поиска по смыслу (векторы), тот же Ollama
      - PRAVKI_LLM_TRUSTED_HOSTS=ollama,host.docker.internal
    volumes:
      - ./playbooks/private:/app/playbooks/private:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # порт не публикуется: движок доступен только веб-сервису внутри сети Docker

  pravki-postgres:
    image: pgvector/pgvector:0.8.1-pg18-bookworm  # PostgreSQL 18 с pgvector: поиск по смыслу (шаг 3)
    container_name: pravki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    restart: unless-stopped

  pravki-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations
    profiles: ["tools"]

  # Локальная модель для пояснений. Включается профилем: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: pravki-ollama
    volumes:
      - ./out/ollama:/root/.ollama
    restart: unless-stopped
    profiles: ["ai"]

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: pravki-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./out/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    profiles: ["monitoring"]
