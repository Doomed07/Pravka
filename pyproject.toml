[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pravki"
version = "0.2.0"
description = "Ассистент юриста: разбор правок контрагента в договорах по плейбуку компании (рабочее название)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lxml>=5", "openpyxl>=3.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pravki = "pravki.cli:main"

[tool.setuptools]
packages = ["pravki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
