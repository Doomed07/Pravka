# ПРИМЕР плейбука для отладки. Это не юридическая позиция: замените значения своими.
#
# Зеркало playbooks/services_example.yaml: тот же договор оказания услуг, но мы — Заказчик.
# Где интересы сторон противоположны, направление проверки перевёрнуто, а пороги переставлены местами:
# предпочтительная позиция Заказчика = граница уступки Исполнителя, и наоборот. Между ними остаётся зона
# торга, где обе стороны получают «уступку», а «принять» одновременно для обеих ролей не бывает.
# Где интересы совпадают (конфиденциальность, ИБ, подсудность, срок ответа на претензию), правила те же.
# Номера SC-NN соответствуют SV-NN; SC-16 — дополнительное правило (у Исполнителя его заменяет SV-02).
name: Оказание услуг (мы — Заказчик) — пример
contract_type: services
our_role: Заказчик
priority_topics:            # что показывать первым
  - возмещение убытков
  - ограничение ответственности
  - расторжение и отказ от договора
rules:
  - id: SC-01
    title: Неустойка Исполнителя за просрочку оказания услуг
    topic: неустойка и штрафы
    match: ['Исполнител\w+\s+уплачива', 'нарушени\w+\s+срока\s+оказани']
    preferred: не менее 0,3% в день
    fallback: не менее 0,1% в день
    red_line: ниже 0,1% в день или отказ от неустойки
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 330 ГК РФ', 'ст. 333 ГК РФ']
    checks:
      - {type: number, unit: percent, label: Ставка неустойки Исполнителя, direction: min, preferred: 0.3, fallback: 0.1,
         context: 'Исполнител\w*\s+уплачива|срок\w*\s+оказани', not_lead: 'не\s+более'}
      - {type: require, patterns: ['Исполнител\w*\s+уплачива\w*\s+(?:\w+\s+){0,2}неустойк'],
         message: Удалена неустойка Исполнителя за просрочку оказания услуг}

  - id: SC-02
    title: Предельный размер неустойки Исполнителя
    topic: неустойка и штрафы
    match: ['Исполнител\w+\s+уплачива[^.;]*не\s+более\s+\d+\s*%', 'оказани[^.;]*не\s+более\s+\d+\s*%']
    preferred: без предела или не менее 20% от суммы договора
    fallback: не менее 10%
    red_line: предел ниже 10%
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: number, unit: percent, label: Предел неустойки Исполнителя, direction: min, preferred: 20, fallback: 10,
         context: 'Исполнител\w*\s+уплачива|срок\w*\s+оказани', lead: 'не\s+более\s*$'}

  - id: SC-03
    title: Наша неустойка за просрочку оплаты
    topic: неустойка и штрафы
    match: ['Заказчик\w*\s+уплачива', 'нарушени\w+\s+срока\s+оплат']
    preferred: не более 0,05% в день
    fallback: до 0,1% в день
    red_line: больше 0,1% в день
    escalate_to: Финансовый директор
    norms: ['ст. 330 ГК РФ', 'ст. 333 ГК РФ']
    checks:
      - {type: number, unit: percent, label: Ставка нашей неустойки за просрочку оплаты, direction: max, preferred: 0.05,
         fallback: 0.1, context: 'Заказчик\w*\s+уплачива|срок\w*\s+оплат', not_lead: 'не\s+более'}

  - id: SC-04
    title: Ограничение ответственности Исполнителя
    topic: ограничение ответственности
    match: ['ограничен\w*\s+(?:\w+\s+){0,3}ответственност', 'совокупн\w+\s+ответственност', 'Исполнител\w*\s+не\s+нес[её]т']
    preferred: ответственность Исполнителя без предела или с пределом не ниже 2× стоимости услуг
    fallback: предел не ниже стоимости услуг
    red_line: предел ниже стоимости услуг или освобождение Исполнителя от ответственности
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 15 ГК РФ', 'ст. 400 ГК РФ', 'п. 4 ст. 401 ГК РФ']
    checks:
      - {type: number, unit: multiple, label: Предел ответственности Исполнителя, direction: min, preferred: 2, fallback: 1}
      - {type: forbid, patterns: ['Исполнител\w*\s+(?:\w+\s+){0,2}не\s+нес[её]т\s+(?:\w+\s+){0,2}ответственност',
                                  'Исполнител\w*\s+(?:\w+\s+){0,2}освобожда\w*\s+от\s+(?:\w+\s+){0,2}ответственност'],
         message: Исполнитель освобождается от ответственности}

  - id: SC-05
    title: Возмещение упущенной выгоды
    topic: ограничение ответственности
    match: ['упущенн\w+\s+выгод']
    preferred: убытки возмещаются в полном объёме, включая упущенную выгоду
    red_line: исключение упущенной выгоды или ограничение возмещения реальным ущербом
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 15 ГК РФ', 'ст. 393 ГК РФ']
    checks:
      - {type: forbid, patterns: ['не\s+(?:возмещает|возмещается|возмещаются|подлеж\w+\s+возмещению)\s+(?:\w+\s+){0,2}упущенн',
                                  'упущенн\w+\s+выгод\w*\s+(?:\w+\s+){0,2}не\s+(?:возмещ|подлеж)',
                                  '(?:только|лишь)\s+реальн\w+\s+ущерб'],
         message: Предлагается исключить возмещение упущенной выгоды}
      - {type: require, patterns: ['включая\s+(?:\w+\s+)?упущенн\w+\s+выгод', 'в\s+том\s+числе\s+(?:\w+\s+)?упущенн\w+\s+выгод',
                                   '(?<!не\s)возмещает\s+(?:[\w,]+\s+){0,4}упущенн\w+\s+выгод'],
         message: Удалено условие о возмещении упущенной выгоды}

  - id: SC-06
    title: Срок оплаты услуг
    topic: порядок и сроки оплаты
    match: ['Заказчик\s+оплачива', 'в\s+течение\s+\d+\s+(?:\w+\s+)?дн\w+\s+с\s+(?:даты|момента)']
    preferred: не менее 30 дней с даты подписания Акта
    fallback: не менее 10 рабочих дней
    red_line: меньше 10 дней или предоплата без обеспечения
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: days, label: Срок оплаты, direction: min, preferred: 30, fallback: 10, context: 'оплат|оплач'}

  - id: SC-07
    title: Цена договора
    topic: цена и сумма договора
    match: ['стоимост\w+\s+(?:\w+\s+){0,2}составля']
    preferred: цена по согласованному коммерческому предложению, без роста
    fallback: рост до 5%
    red_line: рост больше 5% без согласования бюджета
    escalate_to: Финансовый директор
    checks:
      - {type: change, unit: money, label: Цена, unfavorable: up, preferred_pct: 0, fallback_pct: 5}

  - id: SC-08
    title: НДС и налоговые условия
    topic: налоги
    match: ['\bндс\b', 'налог']
    preferred: цена включает НДС; Исполнитель выставляет счета-фактуры и возмещает потери при отказе в вычете
    norms: ['ст. 406.1 ГК РФ', 'ст. 169 НК РФ']
    note: Нужна проверка бухгалтерии и налоговой службы. Интерес Заказчика зависит от его права на вычет НДС, автоматической проверки нет — решает юрист.

  - id: SC-09
    title: Приёмка услуг
    topic: приёмка и качество
    match: ['считаются\s+принят', 'мотивированн\w+\s+отказ', 'подписыва\w+\s+Акт']
    preferred: приёмка только подписанием Акта, без приёмки по умолчанию; срок на подписание не менее 10 рабочих дней
    fallback: срок на подписание не менее 5 рабочих дней
    red_line: приёмка по умолчанию (молчание Заказчика = приёмка) или срок меньше 5 рабочих дней
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 720 ГК РФ', 'ст. 783 ГК РФ']
    checks:
      - {type: forbid, patterns: ['считаются\s+принят', 'считается\s+принят'], message: Предлагается приёмка по умолчанию}
      - {type: number, unit: days, label: Срок на приёмку, direction: min, preferred: 10, fallback: 5,
         context: 'Акт|мотивированн|подписыва'}

  - id: SC-10
    title: Отказ от договора
    topic: расторжение и отказ от договора
    match: ['отказаться\s+от\s+договор', 'уведомив\w*\s+(?:другую\s+)?сторон']
    preferred: Заказчик вправе отказаться в любое время, оплатив фактические расходы Исполнителя; Исполнитель — с уведомлением не менее чем за 30 дней
    fallback: взаимный отказ с уведомлением не менее чем за 15 дней
    red_line: ограничение права Заказчика на отказ или отказ Исполнителя без уведомления
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 450.1 ГК РФ', 'ст. 782 ГК РФ']
    note: Срок уведомления обычно взаимный — короткий выгоден Заказчику, когда отказывается он, и опасен, когда отказывается Исполнитель (срыв проекта). Направление интереса зависит от того, чьё право меняется, автоматической проверки нет — решает юрист.

  - id: SC-11
    title: Односторонние изменения условий
    topic: односторонние изменения условий
    match: ['в\s+одностороннем\s+порядке']
    preferred: цену, сроки и условия Исполнитель меняет только по соглашению сторон; объём услуг Заказчик вправе уточнять заявками
    red_line: право Исполнителя менять цену, объём или сроки в одностороннем порядке
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: forbid, patterns: ['Исполнител\w*\s+(?:(?!не\b)\w+\s+){0,2}вправе\s+(?:\w+\s+){0,4}(?:измен|пересматр|повыш|увелич|корректир)'],
         message: Предлагается право Исполнителя менять условия в одностороннем порядке}

  - id: SC-12
    title: Срок конфиденциальности
    topic: конфиденциальность
    match: ['конфиденциальн']
    preferred: срок действия договора + 3 года
    fallback: до 5 лет
    red_line: бессрочно или больше 5 лет
    checks:
      - {type: number, unit: years, label: Срок конфиденциальности, direction: max, preferred: 3, fallback: 5}

  - id: SC-13
    title: Доступ к информационным системам и ИБ
    topic: персональные данные и ИБ
    match: ['администратор', 'доступ\w*\s+к\s+(?:систем|информационн)']
    preferred: доступ только по принципу наименьших прав, без прав администратора
    red_line: права администратора, полный доступ к инфраструктуре
    escalate_to: Руководитель информационной безопасности
    checks:
      - {type: forbid, patterns: ['администратор', 'полн\w+\s+доступ', 'root'], message: Запрашивается расширенный доступ к системам}

  - id: SC-14
    title: Подсудность и применимое право
    topic: разрешение споров
    match: ['арбитражн\w+\s+суд', 'подсудн']
    preferred: Арбитражный суд города Москвы
    fallback: суд по месту ответчика
    red_line: суд в регионе, где у нас нет присутствия
    note: Автоматической проверки нет — решает юрист.

  - id: SC-15
    title: Срок ответа на претензию
    topic: разрешение споров
    match: ['претензи']
    preferred: 10 календарных дней
    fallback: до 30 дней
    checks:
      - {type: number, unit: days, label: Срок ответа на претензию, direction: max, preferred: 10, fallback: 30, context: 'претензи'}

  - id: SC-16
    title: Предельный размер нашей неустойки за просрочку оплаты
    topic: неустойка и штрафы
    match: ['Заказчик\w*\s+уплачива[^.;]*не\s+более\s+\d+\s*%', 'оплат[^.;]*не\s+более\s+\d+\s*%']
    preferred: не более 10% от суммы договора
    fallback: не более 20%
    red_line: без предела или выше 20%
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: percent, label: Предел нашей неустойки, direction: max, preferred: 10, fallback: 20,
         context: 'Заказчик\w*\s+уплачива|срок\w*\s+оплат', lead: 'не\s+более\s*$'}
