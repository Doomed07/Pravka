# ПРИМЕР плейбука для отладки. Это не юридическая позиция: замените значения своими.
name: Оказание услуг (мы — Исполнитель) — пример
contract_type: services
our_role: Исполнитель
priority_topics:            # что показывать первым
  - возмещение убытков
  - ограничение ответственности
  - расторжение и отказ от договора
rules:
  - id: SV-01
    title: Неустойка за нашу просрочку оказания услуг
    topic: неустойка и штрафы
    match: ['Исполнител\w+\s+уплачива', 'нарушени\w+\s+срока\s+оказани']
    preferred: 0,1% в день
    fallback: до 0,3% в день
    red_line: больше 0,3% в день
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 330 ГК РФ', 'ст. 333 ГК РФ']
    checks:
      - {type: number, unit: percent, label: Ставка неустойки, direction: max, preferred: 0.1, fallback: 0.3,
         context: 'Исполнител|оказани', not_lead: 'не\s+более'}

  - id: SV-02
    title: Предельный размер нашей неустойки за просрочку оказания услуг
    topic: неустойка и штрафы
    match: ['не\s+более\s+\d+\s*%']
    preferred: не более 10% от суммы договора
    fallback: не более 20%
    red_line: без предела или выше 20%
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: number, unit: percent, label: Предел неустойки, direction: max, preferred: 10, fallback: 20,
         context: 'Исполнител\w*\s+уплачива|срок\w*\s+оказани', lead: 'не\s+более\s*$'}

  - id: SV-03
    title: Неустойка за просрочку оплаты Заказчиком
    topic: неустойка и штрафы
    match: ['Заказчик\w*\s+уплачива', 'нарушени\w+\s+срока\s+оплат']
    preferred: не менее 0,1% в день
    fallback: не менее 0,05% в день
    red_line: ниже 0,05% в день или отказ от неустойки
    checks:
      - {type: number, unit: percent, label: Ставка неустойки за просрочку оплаты, direction: min, preferred: 0.1,
         fallback: 0.05, context: 'Заказчик|оплат', not_lead: 'не\s+более'}
      - {type: require, patterns: ['Заказчик\w*\s+уплачива[^.;]*неустойк'],
         message: Удалено условие о неустойке Заказчика за просрочку оплаты}

  - id: SV-04
    title: Ограничение ответственности Исполнителя
    topic: ограничение ответственности
    match: ['ограничен\w*\s+(?:\w+\s+){0,3}ответственност', 'совокупн\w+\s+ответственност']
    preferred: совокупная ответственность не выше стоимости услуг
    fallback: до 2× стоимости услуг
    red_line: ответственность без предела или выше 2× стоимости
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 15 ГК РФ', 'ст. 400 ГК РФ']
    checks:
      - {type: require, patterns: ['ограничен\w*\s+(?:\w+\s+){0,4}(?:сумм|стоимост)'],
         message: Удалено или ослаблено ограничение совокупной ответственности}
      - {type: number, unit: multiple, label: Предел ответственности, direction: max, preferred: 1, fallback: 2}
      - {type: forbid, patterns: ['без\s+ограничени', 'в\s+полном\s+объ[её]ме', 'не\s+ограничива'],
         scope: paragraph, message: Ответственность предлагается без предела}

  - id: SV-05
    title: Исключение упущенной выгоды
    topic: ограничение ответственности
    match: ['упущенн\w+\s+выгод']
    preferred: упущенная выгода не возмещается
    red_line: возмещение упущенной выгоды
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: require, patterns: ['не\s+(?:возмещает|возмещается|подлежит\s+возмещению)\s+(?:\w+\s+){0,2}упущенн'],
         message: Удалено исключение упущенной выгоды}
      - {type: forbid, patterns: ['(?<!не )(?<!не обязан )возмещ\w+\s+(?:\w+\s+){0,3}упущенн\w+\s+выгод'], message: Предлагается возмещать упущенную выгоду}

  - id: SV-06
    title: Срок оплаты услуг
    topic: порядок и сроки оплаты
    match: ['Заказчик\s+оплачива', 'в\s+течение\s+\d+\s+(?:\w+\s+)?дн\w+\s+с\s+(?:даты|момента)']
    preferred: до 10 рабочих дней
    fallback: до 30 дней
    red_line: больше 30 дней или оплата после реализации результата
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: days, label: Срок оплаты, direction: max, preferred: 10, fallback: 30, context: 'оплат|оплач'}

  - id: SV-07
    title: Цена договора
    topic: цена и сумма договора
    match: ['стоимост\w+\s+(?:\w+\s+){0,2}составля']
    preferred: цена по коммерческому предложению
    fallback: снижение до 5%
    red_line: снижение больше 5% без согласования коммерческого отдела
    escalate_to: Коммерческий директор
    checks:
      - {type: change, unit: money, label: Цена, unfavorable: down, preferred_pct: 0, fallback_pct: 5}

  - id: SV-08
    title: НДС и налоговые условия
    topic: налоги
    match: ['\bндс\b', 'налог']
    preferred: НДС в соответствии с налоговым режимом Исполнителя
    note: Нужна проверка бухгалтерии и налоговой службы.

  - id: SV-09
    title: Приёмка услуг
    topic: приёмка и качество
    match: ['считаются\s+принят', 'мотивированн\w+\s+отказ', 'подписыва\w+\s+Акт']
    preferred: молчание считается приёмкой; срок на подписание до 5 рабочих дней
    fallback: срок на подписание до 10 дней
    red_line: удаление автоматической приёмки
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: require, patterns: ['считаются\s+принят', 'считается\s+принят'], message: Удалена приёмка по умолчанию}
      - {type: number, unit: days, label: Срок на приёмку, direction: max, preferred: 5, fallback: 10,
         context: 'Акт|мотивированн|подписыва'}

  - id: SV-10
    title: Отказ от договора
    topic: расторжение и отказ от договора
    match: ['отказаться\s+от\s+договор', 'уведомив\w*\s+(?:другую\s+)?сторон']
    preferred: уведомление не менее чем за 30 календарных дней
    fallback: не менее чем за 15 дней
    red_line: меньше 15 дней или отказ без уведомления
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 450.1 ГК РФ', 'ст. 782 ГК РФ']
    checks:
      - {type: number, unit: days, label: Срок уведомления, direction: min, preferred: 30, fallback: 15}

  - id: SV-11
    title: Односторонние изменения условий
    topic: односторонние изменения условий
    match: ['в\s+одностороннем\s+порядке']
    preferred: изменения только по соглашению сторон
    red_line: право Заказчика менять объём, цену или сроки в одностороннем порядке
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: forbid, patterns: ['Заказчик\w*\s+(?:(?!не\b)\w+\s+){0,2}вправе\s+(?:\w+\s+){0,4}(?:измен|пересматр|уменьш|сокращ|корректир)',
                                  'измен\w+\s+Заказчик\w*\s+(?:\w+\s+){0,2}в\s+одностороннем\s+порядке'],
         message: Предлагается право Заказчика менять условия в одностороннем порядке}

  - id: SV-12
    title: Срок конфиденциальности
    topic: конфиденциальность
    match: ['конфиденциальн']
    preferred: срок действия договора + 3 года
    fallback: до 5 лет
    red_line: бессрочно или больше 5 лет
    checks:
      - {type: number, unit: years, label: Срок конфиденциальности, direction: max, preferred: 3, fallback: 5}

  - id: SV-13
    title: Доступ к нашим системам и ИБ
    topic: персональные данные и ИБ
    match: ['администратор', 'доступ\w*\s+к\s+(?:систем|информационн)']
    preferred: доступ только по принципу наименьших прав, без прав администратора
    red_line: права администратора, полный доступ к инфраструктуре
    escalate_to: Руководитель информационной безопасности
    checks:
      - {type: forbid, patterns: ['администратор', 'полн\w+\s+доступ', 'root'], message: Запрашивается расширенный доступ к системам}

  - id: SV-14
    title: Подсудность и применимое право
    topic: разрешение споров
    match: ['арбитражн\w+\s+суд', 'подсудн']
    preferred: Арбитражный суд города Москвы
    fallback: суд по месту ответчика
    red_line: суд в регионе, где у нас нет присутствия
    note: Автоматической проверки нет — решает юрист.

  - id: SV-15
    title: Срок ответа на претензию
    topic: разрешение споров
    match: ['претензи']
    preferred: 10 календарных дней
    fallback: до 30 дней
    checks:
      - {type: number, unit: days, label: Срок ответа на претензию, direction: max, preferred: 10, fallback: 30, context: 'претензи'}

  - id: SV-16
    title: Предельный размер неустойки Заказчика за просрочку оплаты
    topic: неустойка и штрафы
    match: ['Заказчик\w*\s+уплачива[^.;]*не\s+более\s+\d+\s*%', 'оплат[^.;]*не\s+более\s+\d+\s*%']
    preferred: предел не ниже 10% от суммы договора
    fallback: предел не ниже 8%
    red_line: предел ниже 8% или неустойка Заказчика ограничена слишком низко
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: number, unit: percent, label: Предел неустойки Заказчика, direction: min, preferred: 10, fallback: 8,
         context: 'Заказчик\w*\s+уплачива|срок\w*\s+оплат', lead: 'не\s+более\s*$'}
