# ПРИМЕР плейбука для отладки. Это не юридическая позиция: замените значения своими.
# Рабочий черновик владельца — в playbooks/private/supply_supplier.yaml (в репозиторий не попадает).
name: Поставка (мы — Поставщик) — пример
contract_type: supply
our_role: Поставщик
priority_topics:            # что показывать первым
  - возмещение убытков
  - ограничение ответственности
  - расторжение и отказ от договора
rules:
  - id: SE-01
    title: Неустойка за нашу просрочку поставки
    topic: неустойка и штрафы
    match: ['Поставщик\w*\s+уплачива', 'нарушени\w+\s+срока\s+поставк']
    preferred: 0,1% в день
    fallback: до 0,3% в день
    red_line: больше 0,3% в день
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 330 ГК РФ', 'ст. 521 ГК РФ']
    checks:
      - {type: number, unit: percent, label: Ставка неустойки, direction: max, preferred: 0.1, fallback: 0.3,
         context: 'Поставщик|поставк', not_lead: 'не\s+более'}

  - id: SE-02
    title: Предельный размер нашей неустойки за просрочку поставки
    topic: неустойка и штрафы
    match: ['Поставщик\w*\s+уплачива[^.;]*не\s+более\s+\d+\s*%']
    preferred: не более 10% от стоимости Товара
    fallback: не более 20%
    red_line: без предела или выше 20%
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: number, unit: percent, label: Предел неустойки, direction: max, preferred: 10, fallback: 20,
         context: 'Поставщик\w*\s+уплачива|срок\w*\s+поставк', lead: 'не\s+более\s*$'}

  - id: SE-03
    title: Неустойка Покупателя за просрочку оплаты
    topic: неустойка и штрафы
    match: ['Покупател\w*\s+уплачива', 'нарушени\w+\s+срока\s+оплат']
    preferred: не менее 0,1% в день
    fallback: не менее 0,05% в день
    red_line: ниже 0,05% в день или отказ от неустойки
    checks:
      - {type: number, unit: percent, label: Ставка неустойки за просрочку оплаты, direction: min, preferred: 0.1,
         fallback: 0.05, context: 'Покупател|оплат', not_lead: 'не\s+более'}
      - {type: require, patterns: ['Покупател\w*\s+уплачива[^.;]*неустойк'],
         message: Удалено условие о неустойке Покупателя за просрочку оплаты}

  - id: SE-04
    title: Ограничение ответственности Поставщика
    topic: ограничение ответственности
    match: ['ограничен\w*\s+(?:\w+\s+){0,3}ответственност', 'совокупн\w+\s+ответственност']
    preferred: совокупная ответственность не выше стоимости Товара
    fallback: до 2× стоимости Товара
    red_line: ответственность без предела или выше 2× стоимости
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 15 ГК РФ', 'ст. 400 ГК РФ']
    checks:
      - {type: require, patterns: ['ограничен\w*\s+(?:\w+\s+){0,4}(?:сумм|стоимост)'],
         message: Удалено или ослаблено ограничение совокупной ответственности}
      - {type: number, unit: multiple, label: Предел ответственности, direction: max, preferred: 1, fallback: 2}
      - {type: forbid, patterns: ['без\s+ограничени', 'в\s+полном\s+объ[её]ме', 'не\s+ограничива'],
         scope: paragraph, message: Ответственность предлагается без предела}

  - id: SE-05
    title: Исключение упущенной выгоды
    topic: ограничение ответственности
    match: ['упущенн\w+\s+выгод']
    preferred: упущенная выгода не возмещается
    red_line: возмещение упущенной выгоды
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: require, patterns: ['не\s+(?:возмещает|возмещается|подлежит\s+возмещению)\s+(?:\w+\s+){0,2}упущенн'],
         message: Удалено исключение упущенной выгоды}
      - {type: forbid, patterns: ['(?<!не )(?<!не обязан )возмещ\w+\s+(?:\w+\s+){0,3}упущенн\w+\s+выгод'], message: Предлагается возмещать упущенную выгоду}

  - id: SE-06
    title: Срок окончательной оплаты Товара
    topic: порядок и сроки оплаты
    match: ['Покупатель\s+оплачива', 'оставш\w+\s+част\w+\s+стоимост']
    preferred: до 10 рабочих дней с даты накладной
    fallback: до 30 дней
    red_line: больше 30 дней или оплата после перепродажи Товара
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: days, label: Срок оплаты, direction: max, preferred: 10, fallback: 30, context: 'оплачива|оплат'}

  - id: SE-07
    title: Аванс
    topic: порядок и сроки оплаты
    match: ['аванс']
    preferred: аванс 30% до начала поставки
    fallback: аванс не ниже 20%
    red_line: аванс ниже 20% или поставка без аванса
    escalate_to: Финансовый директор
    checks:
      - {type: require, patterns: ['аванс'], message: Удалён аванс}
      - {type: number, unit: percent, label: Размер аванса, direction: min, preferred: 30, fallback: 20, context: 'аванс'}

  - id: SE-08
    title: Цена Товара
    topic: цена и сумма договора
    match: ['стоимост\w+\s+(?:\w+\s+){0,2}составля']
    preferred: цена по коммерческому предложению
    fallback: снижение до 5%
    red_line: снижение больше 5% без согласования коммерческого отдела
    escalate_to: Коммерческий директор
    checks:
      - {type: change, unit: money, label: Цена, unfavorable: down, preferred_pct: 0, fallback_pct: 5}

  - id: SE-09
    title: НДС и налоговые условия
    topic: налоги
    match: ['\bндс\b', 'налог']
    preferred: НДС в соответствии с налоговым режимом Поставщика
    note: Нужна проверка бухгалтерии.

  - id: SE-10
    title: Срок поставки
    topic: сроки исполнения
    match: ['поставля\w*\s+Товар\s+в\s+течение', 'срок\w*\s+поставк']
    preferred: не менее 30 календарных дней с даты аванса
    fallback: не менее 20 дней
    red_line: меньше 20 дней
    escalate_to: Руководитель отдела логистики
    checks:
      - {type: number, unit: days, label: Срок поставки, direction: min, preferred: 30, fallback: 20, context: 'поставля|поставк'}

  - id: SE-11
    title: Приёмка Товара по качеству
    topic: приёмка и качество
    match: ['принима\w+\s+Товар', 'по\s+качеству']
    preferred: до 5 рабочих дней с даты получения
    fallback: до 10 дней
    red_line: больше 10 дней
    checks:
      - {type: number, unit: days, label: Срок приёмки по качеству, direction: max, preferred: 5, fallback: 10,
         context: 'качеств|принима'}

  - id: SE-12
    title: Переход права собственности и риска
    topic: переход права собственности и риска
    match: ['риск\w*\s+случайн\w+\s+гибел', 'прав\w*\s+собственност\w*\s+(?:\w+\s+){0,6}переход']
    preferred: с даты подписания товарной накладной
    red_line: переход риска после оплаты или после ввода в эксплуатацию
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 459 ГК РФ']
    checks:
      - {type: require, patterns: ['переход\w*\s+к\s+Покупател\w*\s+с\s+(?:даты|момента)\s+(?:подписания\s+товарной\s+накладной|передачи|поставки)'],
         message: Изменён момент перехода права собственности и риска}

  - id: SE-13
    title: Гарантийный срок
    topic: приёмка и качество
    match: ['гарантийн\w+\s+срок']
    preferred: 12 месяцев с даты поставки
    fallback: до 18 месяцев
    red_line: больше 18 месяцев
    checks:
      - {type: number, unit: months, label: Гарантийный срок, direction: max, preferred: 12, fallback: 18}

  - id: SE-14
    title: Срок устранения недостатков
    topic: приёмка и качество
    match: ['устраня\w+\s+недостатк']
    preferred: 20 рабочих дней
    fallback: не менее 10 дней
    red_line: меньше 10 дней
    checks:
      - {type: number, unit: days, label: Срок устранения недостатков, direction: min, preferred: 20, fallback: 10,
         context: 'недостатк|устраня'}

  - id: SE-15
    title: Отказ Покупателя от договора при просрочке поставки
    topic: расторжение и отказ от договора
    match: ['отказаться\s+от\s+договор']
    preferred: при просрочке поставки более 30 календарных дней
    fallback: более 20 дней
    red_line: меньше 20 дней
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 523 ГК РФ']
    checks:
      - {type: number, unit: days, label: Допустимая просрочка поставки, direction: min, preferred: 30, fallback: 20}

  - id: SE-16
    title: Подсудность и применимое право
    topic: разрешение споров
    match: ['арбитражн\w+\s+суд', 'подсудн']
    preferred: Арбитражный суд города Москвы
    fallback: суд по месту ответчика
    red_line: суд в регионе, где у нас нет присутствия
    note: Автоматической проверки нет — решает юрист.

  - id: SE-17
    title: Срок ответа на претензию
    topic: разрешение споров
    match: ['ответ\w*\s+на\s+претензи']
    preferred: 10 календарных дней
    fallback: до 30 дней
    checks:
      - {type: number, unit: days, label: Срок ответа на претензию, direction: max, preferred: 10, fallback: 30,
         context: 'ответ\w*\s+на\s+претензи'}
