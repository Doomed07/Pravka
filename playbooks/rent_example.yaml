# ПРИМЕР плейбука для отладки. Это не юридическая позиция: замените значения своими.
name: Аренда нежилого помещения (мы — Арендатор) — пример
contract_type: lease
our_role: Арендатор
priority_topics:
  - возмещение убытков
  - ограничение ответственности
  - расторжение и отказ от договора
rules:
  - id: RN-01
    title: Размер арендной платы
    topic: арендная плата и индексация
    match: ['арендн\w+\s+плат\w+\s+(?:\w+\s+){0,3}составля']
    preferred: ставка по согласованному коммерческому предложению
    fallback: рост до 5%
    red_line: рост больше 5% без согласования
    escalate_to: Финансовый директор
    checks:
      - {type: change, unit: money, label: Арендная плата, unfavorable: up, preferred_pct: 0, fallback_pct: 5}

  - id: RN-02
    title: Индексация арендной платы
    topic: арендная плата и индексация
    match: ['индексир', 'индексаци']
    preferred: не чаще раза в год, не более 5%
    fallback: до 8%
    red_line: выше 8% или без предела
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: percent, label: Индексация, direction: max, preferred: 5, fallback: 8, context: 'индекс'}

  - id: RN-03
    title: Обеспечительный платёж
    topic: порядок и сроки оплаты
    match: ['обеспечительн']
    preferred: один месячный платёж
    fallback: до двух месячных платежей
    red_line: больше двух месячных платежей
    escalate_to: Финансовый директор
    checks:
      - {type: number, unit: monthly_payments, label: Обеспечительный платёж, direction: max, preferred: 1, fallback: 2}

  - id: RN-04
    title: Отказ Арендатора от договора
    topic: расторжение и отказ от договора
    match: ['Арендатор\w*\s+вправе\s+отказаться', 'отказаться\s+от\s+договор']
    preferred: уведомление за 30 календарных дней
    fallback: до 60 дней
    red_line: больше 60 дней или отказ только с согласия Арендодателя
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: number, unit: days, label: Срок уведомления, direction: max, preferred: 30, fallback: 60}

  - id: RN-05
    title: Расторжение Арендодателем при просрочке
    topic: расторжение и отказ от договора
    match: ['Арендодатель\w*\s+вправе\s+(?:\w+\s+){0,3}расторгнуть', 'просрочк\w+\s+(?:\w+\s+){0,3}более']
    preferred: не раньше 10 календарных дней просрочки и после письменного предупреждения
    fallback: от 5 дней
    red_line: меньше 5 дней или без предупреждения
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 619 ГК РФ']
    checks:
      - {type: number, unit: days, label: Допустимая просрочка, direction: min, preferred: 10, fallback: 5, context: 'просрочк'}

  - id: RN-06
    title: Субаренда
    topic: субподряд, субаренда, передача прав
    match: ['субаренд']
    preferred: вправе сдавать в субаренду с уведомлением Арендодателя
    fallback: с согласия Арендодателя, которое нельзя необоснованно отказать
    red_line: запрет субаренды
    escalate_to: Директор по правовым вопросам
    norms: ['ст. 615 ГК РФ']
    checks:
      - {type: require, patterns: ['вправе\s+(?:сдавать|сдать)\s+(?:\w+\s+){0,2}в\s+субаренду'], message: Удалено право на субаренду}
      - {type: forbid, patterns: ['не\s+вправе\s+(?:сдавать|сдать)\s+(?:\w+\s+){0,2}в\s+субаренду', 'без\s+права\s+(?:\w+\s+){0,2}субаренд', 'запрещ\w+\s+(?:\w+\s+){0,3}субаренд'],
         scope: paragraph, message: Субаренда запрещается}

  - id: RN-07
    title: Неустойка за просрочку платежей
    topic: неустойка и штрафы
    match: ['неустойк', 'пени']
    preferred: не более 0,1% в день
    fallback: до 0,3% в день
    red_line: больше 0,3% в день
    checks:
      - {type: number, unit: percent, label: Ставка неустойки, direction: max, preferred: 0.1, fallback: 0.3, not_lead: 'не\s+более'}

  - id: RN-08
    title: Ответственность Арендодателя
    topic: ограничение ответственности
    match: ['упущенн\w+\s+выгод', 'ответственност\w+\s+Арендодател']
    preferred: ответственность Арендодателя за нарушение в полном объёме реального ущерба
    red_line: полное исключение ответственности Арендодателя
    escalate_to: Директор по правовым вопросам
    checks:
      - {type: forbid, patterns: ['Арендодатель\s+не\s+(?:несет|несёт|отвечает)', 'освобожда\w+\s+(?:\w+\s+){0,2}Арендодател'],
         scope: paragraph, message: Арендодатель освобождается от ответственности}

  - id: RN-09
    title: Срок аренды
    topic: срок действия договора
    match: ['срок\w*\s+аренд', 'вступает\s+в\s+силу']
    preferred: 11 месяцев с автопролонгацией
    fallback: от 6 месяцев
    red_line: меньше 6 месяцев
    checks:
      - {type: number, unit: months, label: Срок аренды, direction: min, preferred: 11, fallback: 6}

  - id: RN-10
    title: Ремонт и содержание помещения
    topic: содержание и ремонт имущества
    match: ['ремонт', 'содержани']
    preferred: капитальный ремонт — Арендодатель, текущий — Арендатор
    red_line: капитальный ремонт и неотделимые улучшения за счёт Арендатора
    note: Автоматической проверки нет — решает юрист совместно с эксплуатацией.

  - id: RN-11
    title: Коммунальные услуги
    topic: арендная плата и индексация
    match: ['коммунальн']
    preferred: по показаниям счётчиков, по фактическим тарифам ресурсоснабжающих организаций
    fallback: с наценкой не более 5%
    note: Автоматической проверки нет — решает юрист совместно с бухгалтерией.

  - id: RN-12
    title: Подсудность
    topic: разрешение споров
    match: ['арбитражн\w+\s+суд', 'подсудн']
    preferred: по месту нахождения ответчика или по месту нахождения помещения
    note: Автоматической проверки нет — решает юрист.
